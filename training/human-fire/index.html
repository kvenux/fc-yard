<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>限速策略验证</title><style>body{margin:30px auto;max-width:1000px;padding:0 20px;background:#eee5cf;color:#612b32;font:15px/1.7 system-ui}h1{font-size:26px}canvas{width:100%;background:#faf5e8;border:1px solid #c9b58a}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #c9b58a;padding:8px}small{color:#806e57}a{color:inherit}</style><h1>限速策略 · 全关复验</h1><p>60 帧/游戏秒；开火间隔 ≥ 12 帧，只对有效目标射击。曲线仅计从第 1 关起步的完整尝试；分关筛选另列。每 5 秒刷新。</p><canvas id="curve" width="1000" height="330"></canvas><div id="full"></div><h2>分关候选筛选</h2><small>自然到达的关卡入口存档；这些结果不等于整局通关。最近 30 个候选。</small><div id="trials"></div><script>
async function rows(url){const r=await fetch(url+'?t='+Date.now());if(!r.ok)return [];return (await r.text()).trim().split('\n').filter(Boolean).map(JSON.parse)}
function table(head,rows){return '<table><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>'}
async function draw(){const full=[...await rows('full-results.jsonl'),...await rows('../human-fire-v2/full-results.jsonl')];const ctx=document.getElementById('curve').getContext('2d');ctx.clearRect(0,0,1000,330);ctx.strokeStyle='#baa77e';ctx.beginPath();ctx.moveTo(65,25);ctx.lineTo(65,275);ctx.lineTo(970,275);ctx.stroke();const max=Math.max(10000,...full.map(r=>r.score));ctx.font='15px monospace';ctx.fillStyle='#612b32';ctx.fillText(max.toLocaleString()+' 分',10,20);ctx.strokeStyle='#981e36';ctx.lineWidth=3;ctx.beginPath();full.forEach((r,i)=>{const x=100+i*800/Math.max(1,full.length-1),y=275-r.score/max*235;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();full.forEach((r,i)=>{const x=100+i*800/Math.max(1,full.length-1),y=275-r.score/max*235;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.fillText(r.score.toLocaleString(),x-25,y-15);ctx.fillText('轮 '+(i+1),x-20,305)});document.getElementById('full').innerHTML=table(['轮次','通过关数','得分','游戏时长','结果'],full.map((r,i)=>[i+1,r.cleared+'/35',r.score,Math.round(r.frames/60)+' 秒',r.victory?'全关通过':r.interrupted?'中止僵持候选':'未通过']));const trials=await rows('../human-fire-v2/episodes.jsonl');document.getElementById('trials').innerHTML=table(['关卡','候选','累计分数','剩余生命','结果'],trials.slice(-30).reverse().map(r=>[r.stage,r.id,r.score,r.lives,r.clear&&r.eagle&&r.lives>0?'通过':'淘汰']));}draw();setInterval(draw,5000);
</script></html>
