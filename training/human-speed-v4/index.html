<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提速策略复验</title><style>body{max-width:960px;margin:32px auto;padding:0 20px;font:16px/1.7 "Microsoft YaHei",sans-serif;background:#eee5cf;color:#702536}h1{font-size:26px}.summary{background:#fff5de;border:2px solid #90283e;padding:24px;margin-bottom:24px;border-radius:8px}.bar{height:30px;background:#9f334b;color:white;padding:3px 10px;box-sizing:border-box;margin:10px 0;font-size:14px;white-space:nowrap}.old{background:#ad9674}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #c9b68d;text-align:right}td:first-child,th:first-child{text-align:left}a{color:inherit}.small{font-size:13px;color:#806d57}</style><h1>GPT-6 通关小霸王 · 提速复验</h1><div id="result">读取验证结果…</div><p class="small">同为种子 4004、35 关完整通关。按 60 FPS 游戏时间计算，非播放倍速。单关比较包含过关转场；后续敌情会随前面策略变化。</p><table><thead><tr><th>关卡</th><th>之前</th><th>提速后</th><th>最长原地停留</th><th>剩余生命</th></tr></thead><tbody id="stages"></tbody></table><p><a href="../human-speed/index.html">查看上一版提速记录</a> · <a href="/live.html">返回直播</a></p><script>
const time=f=>{const s=Math.round(f/60);return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'};fetch('comparison.json').then(r=>r.json()).then(d=>{document.getElementById('result').innerHTML=`<div class="summary"><strong>35 / 35 · ${d.score.toLocaleString()} 分 · ${d.lives} 条生命</strong><p>缩短 ${((1-d.newFrames/d.oldFrames)*100).toFixed(1)}%，节省 ${time(d.oldFrames-d.newFrames)}</p><div class="bar old" style="width:100%">之前 ${time(d.oldFrames)}</div><div class="bar" style="width:${d.newFrames/d.oldFrames*100}%">现在 ${time(d.newFrames)}</div><span class="small">纯按键回放一致；最短开火间隔 ${d.minFireGap/60*1000}ms。</span></div>`;document.getElementById('stages').innerHTML=d.newStages.map((s,i)=>`<tr><td>${s.stage}</td><td>${time(d.oldStages[i].frames)}</td><td>${time(s.frames)}</td><td>${(d.stats[s.stage].maxIdle/60).toFixed(1)}秒</td><td>${s.lives}</td></tr>`).join('')}).catch(()=>document.getElementById('result').textContent='完整复验仍在进行，结果尚未发布。');
</script></html>
