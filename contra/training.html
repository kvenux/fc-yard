*{box-sizing:border-box}body{max-width:1080px;margin:32px auto;padding:0 20px;background:#efe5d1;color:#4c2830;font:16px/1.7 system-ui}h1{margin-bottom:6px}a{color:#922a32}.summary,.chart{background:#fff8e9;border:1px solid #cebaa0;border-radius:12px;padding:20px;margin:18px 0}.metrics{display:flex;gap:32px;flex-wrap:wrap}.metrics b{font-size:30px;display:block}.muted{font-size:14px;color:#78685e}select{padding:8px;max-width:100%}svg{width:100%;height:auto;display:block}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}td,th{padding:8px;border-bottom:1px solid #d5c4ac;text-align:right}td:first-child,th:first-child{text-align:left}.table{overflow-x:auto}.bad{color:#b22733}
</style></head><body><h1>魂斗罗 · 通关策略训练</h1><p class="muted">参照坦克大战的逐轮记录：候选表现、历史最好表现、独立按键回放。包含参数搜索与模拟器前瞻。</p>
<div class="summary"><strong id="status">读取训练记录…</strong><p id="blockers"></p><p id="model"></p><p id="native"></p><div class="metrics"><div>已完成候选<b id="count">0</b></div><div>完整通关<b id="victories">0</b></div><div>一命通关<b id="one-life">0</b></div><div>回放核验通过<b id="verified">0</b></div></div></div>
<figure class="summary" id="native-preview" hidden><img id="native-frame" alt="原生模拟器最近一次训练画面" style="width:512px;max-width:100%;image-rendering:pixelated;background:#000"><figcaption class="muted">实际训练画面快照，每 5 秒刷新；并非逐帧视频。</figcaption></figure>
<div id="milestones"></div><label>可比较实验组 <select id="group"><option>暂无训练记录</option></select></label><p id="scope" class="muted"></p><p id="rounds" class="muted"></p><div id="charts"></div>
<div class="table"><table><thead><tr><th>轮次 / 候选</th><th>最远关卡序号</th><th>生命损失</th><th>模拟帧</th><th>回放</th><th>完整通关</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="muted">每 5 秒刷新。最远到达第 N 关不等于通过 N 关；进度只在同一关内比较。ROM、模拟器、观察器或帧预算不同的实验分组展示。当前为开发集确定性搜索，没有跨版本成功率结论。</p><p><a href="runs/episodes.csv">下载 CSV</a> · <a href="runs/learning-curve.json">原始曲线数据</a> · <a href="live.html">直播页面</a> · <a href="replay.html">八关通关回放</a></p>
