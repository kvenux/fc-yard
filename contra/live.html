<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魂斗罗 · AI 训练直播</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1b1a18;color:#292521;font:16px system-ui}main{max-width:680px;margin:28px auto;background:#efe5d1;border-radius:22px;overflow:hidden;box-shadow:0 24px 90px #0009}header{padding:26px 30px;background:#922a32;color:#fff}small{letter-spacing:3px;color:#efc5a4}h1{margin:8px 0;font-size:32px}header p{margin:0;opacity:.8}.screen{margin:22px;background:#10151a;border:12px solid #3e3934;border-radius:14px;padding:8px}canvas{display:block;width:100%;image-rendering:pixelated;aspect-ratio:256/240;background:#000}.info{margin:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.info div{border-top:2px solid #9b3036;padding:10px 0}.info b{display:block;margin-top:5px;font-size:23px}#reason{margin:22px;min-height:48px;font-weight:600}#keys{display:flex;gap:7px;padding:20px;background:#d8c8af;justify-content:center}#keys span{padding:10px 12px;border-radius:8px;background:#3b3631;color:#fff}#keys .active{background:#a32630;box-shadow:0 0 0 3px #e18b60}.controls{padding:4px 22px 24px}label{display:block;margin:12px 0;font-size:14px}input{max-width:100%}button,select{padding:9px 12px;margin:5px 5px 5px 0;border:1px solid #ac9580;border-radius:6px;background:#fff9ed;color:#4b2424}button:disabled{opacity:.45}#message{font-size:14px;line-height:1.6;color:#6b4435;overflow-wrap:anywhere}.capture main{margin:0 auto;border-radius:0}.capture .controls{display:none}@media(max-width:700px){main{margin:0;border-radius:0}.screen{margin:14px}.info{margin:18px}#keys{gap:4px}#keys span{padding:9px}}
</style></head><body><main><header><small>FC · AI PLAY LAB</small><h1>魂斗罗</h1><p>真实 NES 模拟 · 策略训练与按键回放</p></header>
<div class="screen"><canvas id="screen" width="256" height="240"></canvas></div>
<section class="info"><div>模式<b id="mode">等待 ROM</b></div><div>关卡 / 生命<b id="stats">— / —</b></div><div>模拟帧<b id="frames">0</b></div></section>
<p id="reason">载入 ROM 后可运行策略、回放训练或采集校准证据。</p><div id="keys"></div>
<section class="controls"><label>魂斗罗 .nes <input type="file" id="rom" accept=".nes"></label><label>已校准观察器 <input type="file" id="profile" accept=".json"></label><label>策略参数 <input type="file" id="policy" accept=".json"></label><label>训练候选按键记录 <input type="file" id="replay" accept=".json"></label>
<button id="load">载入项目 ROM 与策略</button><button id="model-replay">JSNES 前瞻回放</button><a href="training.html">训练曲线</a> · <a href="replay.html">八关通关回放</a><br><button id="pause" disabled>运行</button><button id="step" disabled>单帧</button><button id="start" disabled>START</button><button id="ai" disabled>启用 AI</button><button id="capture" disabled>保存校准样本</button><select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><button id="clean">直播画幅</button>
<p>方向键移动，Z 跳跃（A），X 射击（B），Enter 开始。Esc 返回控制区。当前无音频输出。</p><p id="message">点击载入项目 ROM 与策略；实际训练成绩见训练曲线。</p></section></main>
<script src="/node_modules/jsnes/dist/jsnes.js"></script><script src="engine.js"></script><script src="live.js"></script></body></html>
