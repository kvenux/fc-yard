<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>风云再起 · 并行训练</title>
<style>body{background:#111725;color:#e9edf6;font:16px system-ui;max-width:1000px;margin:40px auto;padding:0 20px}a{color:#8fd8ff}.cards{display:flex;gap:16px;flex-wrap:wrap}.card{background:#1c2739;border-radius:12px;padding:20px;min-width:150px}strong{display:block;font-size:30px;color:#8fdfb5}p{color:#bac6d7;line-height:1.6}img{max-width:100%;border-radius:10px}pre{white-space:pre-wrap;background:#1c2739;padding:16px}</style>
<h1>风云再起 · 并行训练</h1><p>关闭游戏视频，只读 RAM，通过实际按键试局。此页统计同一难点节点的策略评估；节点通过不等于整局一命通关。</p>
<div class="cards"><div class="card">已完成<strong id="count">—</strong></div><div class="card">合计模拟速度<strong id="speed">—</strong></div><div class="card">候选胜局<strong id="wins">—</strong></div></div>
<h2>行为树策略</h2><p>优先处理受伤与夹击，再按站位使用道具、对齐、追击、连招。每条分支记录实战触发，通关需完整开机验证。</p><pre id="strategies">等待策略结果</pre><h2>短窗口分支搜索</h2><p id="search">读取搜索进度</p><p id="cohort"></p><pre id="running">等待训练状态</pre><img id="curve" alt="本批训练完成后显示曲线" hidden><p><a href="/live.html?capture=1">当前内存状态与按键</a> · <a href="/ram-training-curve.png">无画面训练得分曲线</a> · <a href="/campaign-progress.png">连续路线曲线</a></p>
<script>async function update(){try{const q=await(await fetch('/api/search')).json();document.getElementById('search').textContent=`${q.search} · 已检查 ${q.rollouts} 条短分支 · 当前最优：敌人 ${q.boss_hp} 血 / 己方 ${q.hp} 血 · ${q.finished?'搜索结束':'正在搜索'}`}catch(e){}try{const d=await(await fetch('/api/batch')).json();document.getElementById('count').textContent=`${d.completed}/${d.total??'—'}`;document.getElementById('speed').textContent=d.aggregate_fps?`${(d.aggregate_fps/59.18).toFixed(1)}×`:'统计中';document.getElementById('wins').textContent=d.candidate_wins??0;document.getElementById('cohort').textContent=d.cohort+' · 累计完成 '+(d.all_completed_trials??'—')+' 次节点评估';document.getElementById('running').textContent=(d.running_trials??[]).map(r=>`试局帧数 ${r.frame} · 己方血量 ${r.observation.hp} · 敌人最低血量 ${r.boss_min_hp}`).join('\n')||'本批暂无运行中的试局';document.getElementById('strategies').textContent=(d.strategy_results??[]).map(r=>`${r.name} · ${r.frames} 帧 · 敌人削血 ${r.damage} · 剩余血量 ${r.hp} · 房间通过 ${r.room_clear?'是':'否'}`).join('\n')||'当前策略正在评估';const im=document.getElementById('curve');if(d.completed===d.total){im.src='/batch-curve.png?t='+Date.now();im.hidden=false}}catch(e){document.getElementById('running').textContent='正在初始化训练'}}update();setInterval(update,3000)</script></html>
